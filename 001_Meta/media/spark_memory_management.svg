<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #333; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #fff; }
      .sublabel { font-family: sans-serif; font-size: 14px; fill: #fff; }
      .text-dark { fill: #333; }
      .border { stroke: #333; stroke-width: 2; }
      .dashed { stroke: #fff; stroke-width: 4; stroke-dasharray: 8,8; }
    </style>
  </defs>

  <!-- Background / Total Container -->
  <rect x="40" y="40" width="720" height="570" fill="#f4f6f8" class="border" rx="10"/>
  <text x="400" y="80" text-anchor="middle" class="title">Spark Executor Memory Architecture</text>

  <!-- JVM Heap Memory Section -->
  <rect x="60" y="110" width="680" height="380" fill="#e9ecef" class="border" rx="5"/>
  <text x="400" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#495057">JVM On-Heap Memory (spark.executor.memory)</text>

  <!-- Reserved Memory -->
  <rect x="80" y="160" width="640" height="50" fill="#ffc107" class="border" rx="4"/>
  <text x="400" y="192" text-anchor="middle" class="label text-dark">Reserved Memory (300 MB System Hardcoded)</text>

  <!-- User Memory -->
  <rect x="80" y="230" width="640" height="80" fill="#17a2b8" class="border" rx="4"/>
  <text x="400" y="265" text-anchor="middle" class="label">User Memory (Default: 40%)</text>
  <text x="400" y="290" text-anchor="middle" class="sublabel">User data structures, internal metadata, UDF objects</text>

  <!-- Spark Memory -->
  <rect x="80" y="330" width="640" height="140" fill="#6c757d" class="border" rx="4"/>
  <text x="400" y="355" text-anchor="middle" class="label">Spark Memory (Default: 60% via spark.memory.fraction)</text>

  <!-- Execution & Storage Split -->
  <rect x="90" y="370" width="300" height="90" fill="#dc3545" class="border" rx="4"/>
  <text x="240" y="410" text-anchor="middle" class="label">Execution Memory</text>
  <text x="240" y="435" text-anchor="middle" class="sublabel">Shuffles, Joins, Sorts</text>

  <rect x="410" y="370" width="300" height="90" fill="#28a745" class="border" rx="4"/>
  <text x="560" y="410" text-anchor="middle" class="label">Storage Memory</text>
  <text x="560" y="435" text-anchor="middle" class="sublabel">Cached RDDs, Broadcasts</text>

  <!-- Dynamic Boundary Line -->
  <line x1="400" y1="365" x2="400" y2="465" class="dashed"/>
  <text x="400" y="485" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#343a40">Dynamic Boundary (spark.memory.storageFraction = 0.5)</text>

  <!-- Off-Heap Memory Section -->
  <rect x="60" y="510" width="680" height="80" fill="#6f42c1" class="border" rx="5"/>
  <text x="400" y="540" text-anchor="middle" class="label">Off-Heap Memory (spark.memory.offHeap.size)</text>
  <text x="400" y="565" text-anchor="middle" class="sublabel">Direct RAM, no Garbage Collection. Acts as combined Execution &amp; Storage memory.</text>
</svg>
